name: warm

# 每 6 小时续期一次（UTC 00/06/12/18 = 北京 08/14/20/02），让会话保持活跃。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: wxread-warm
  cancel-in-progress: false

permissions:
  contents: write # 新 wr_skey 要写回状态分支

jobs:
  warm:
    name: warm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 续期
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WXREAD_STATE_KEY: ${{ secrets.WXREAD_STATE_KEY }}
        run: python -m wxread.worker warm
